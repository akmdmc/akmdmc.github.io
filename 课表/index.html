<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>Document</title>
  <script src="./main.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <div id="container">
    <div id="header">
      <div class="week month">
        <p>9月</p>
      </div>
      <div class="week">
        <p>1</p>
      </div>
      <div class="week">

      </div>

      <div class="week">
        <p>4</p>
      </div>
      <div class="week">
        <p>5</p>

    <div id="bottomContainer">
      <div id="leftBanner">
        <!-- <div>
          <div>1</div>
          <div>8:15 ~ 9:00</div>
        </div> -->
      </div>
    </div>
  </div>
  <button id="btn">今日课表</button>
  <script>

    (() => {
      const leftBanner = document.getElementById("leftBanner")
      const fragment = document.createDocumentFragment()
      Object.entries(DayTimeArray).map((item) => {
        const div = document.createElement("div")
        const index = document.createElement("div")
        index.innerText = item[0]
        const timeRange = document.createElement("div")
        timeRange.innerText = item[1][0] + "~" + item[1][1]
        div.appendChild(index)
        div.appendChild(timeRange)
        fragment.appendChild(div)
      })
      leftBanner.appendChild(fragment)
    })()


    let btn = document.getElementById("btn")
    btn.addEventListener("click", btnClick)
    function btnClick() {

      console.log(getLesson({
        year: 2024,
        month: 9,
        day: 11,
      }));

      const date = new Date();
      console.log(getAfterNDay({
        year: date.getFullYear(),
        month: date.getMonth() + 1,
        day: date.getDate(),
        n: -10
      }));


    }
  </script>
</body>

</html>
