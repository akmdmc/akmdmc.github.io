<body>


  <div id="lessonContainer">
    <div id="header">
      <div class="month">
        <p>9月</p>
      </div>
      <div class="week">
        <p>一</p>
      </div>
      <div class="week">
        <p>二</p>
      </div>
      <div class="week">
        <p>三</p>
      </div>
      <div class="week">
        <p>四</p>
      </div>
      <div class="week">
        <p>五</p>
      </div>
    </div>
    <div id="bottomContainer">
      <div id="leftBanner">
      </div>
      <div id="rightLesson">
      </div>
    </div>
  </div>
  <script>
    (() => {
      const leftBanner = document.getElementById("leftBanner")
      const fragment = document.createDocumentFragment()
      Object.entries(DAY_TIME_ARRAY).map((item) => {
        const div = document.createElement("div")
        div.className = "leftBox"
        const index = document.createElement("div")
        index.className = "title"
        index.innerText = item[0]
        const timeRange1 = document.createElement("div")
        timeRange1.className = "miniText"
        timeRange1.innerText = item[1][0]
        const timeRange2 = document.createElement("div")
        timeRange2.className = "miniText"
        timeRange2.innerText = item[1][1]
        div.appendChild(index)
        div.appendChild(timeRange1)
        div.appendChild(timeRange2)
        fragment.appendChild(div)
      })
      leftBanner.appendChild(fragment)

      const weeks = document.querySelectorAll(".week")
      const date = new Date();
      const today = {
        year: date.getFullYear(),
        month: date.getMonth() + 1,
        day: date.getDate(),
      }
      weeks.forEach((week, index) => {
        const p = document.createElement("p")
        if (index + 1 == date.getDay()) {
          week.className = "week today"
        }
        p.innerText = getAfterNDay({ ...today, n: index + 1 - date.getDay() }).day
        week.appendChild(p)
      })
    })()
    function renderLessonContainer() {
      const rightLesson = document.getElementById("rightLesson")
      const CONTAINER_HEIGHT = rightLesson.clientHeight
      const CONTAINER_WIDTH = rightLesson.clientWidth
      const DAY_TIME_NODE_NUMBER = 11
      const WEEK_DAY_NUMBER = 5
      const BOX_HEIGHT = CONTAINER_HEIGHT / DAY_TIME_NODE_NUMBER
      const BOX_WIDTH = CONTAINER_WIDTH / WEEK_DAY_NUMBER

      function addLessonBox(lessons, fatherElement) {
        const fragment = document.createDocumentFragment()
        lessons.map((lesson) => {
          const lessonBox = document.createElement("div")
          lessonBox.style.top = `${BOX_HEIGHT * (lesson.lessonDayTimeRange[0] - 1)}px`
          lessonBox.style.left = `${BOX_WIDTH * (lesson.lessonWeek - 1)}px`
          lessonBox.className = "lessonBox"
          lessonBox.style.width = BOX_WIDTH - 4 + 'px'
          lessonBox.style.height = BOX_HEIGHT * (lesson.lessonDayTimeRange[1] - lesson.lessonDayTimeRange[0] + 1) - 5 + 'px'

          const lessonName = document.createElement("div")
          lessonName.style.marginBottom = "2px"
          lessonName.innerText = lesson.lessonName
          const lessonClassRoom = document.createElement("div")
          lessonClassRoom.innerText = lesson.lessonClassRoom

          lessonBox.appendChild(lessonName)
          lessonBox.appendChild(lessonClassRoom)

          fragment.appendChild(lessonBox)
        })

        fatherElement.appendChild(fragment)
      }

      setTimeout(() => {
        addLessonBox(getWeekLesson(), rightLesson)
      }, 100)
    }

    renderLessonContainer()
  </script>
