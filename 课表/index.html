    function renderLessonContainer() {
      const rightLesson = document.getElementById("rightLesson")
      const CONTAINER_HEIGHT = rightLesson.clientHeight
      const CONTAINER_WIDTH = rightLesson.clientWidth
      const DAY_TIME_NODE_NUMBER = 11
      const WEEK_DAY_NUMBER = 5
      const BOX_HEIGHT = CONTAINER_HEIGHT / DAY_TIME_NODE_NUMBER
      const BOX_WIDTH = CONTAINER_WIDTH / WEEK_DAY_NUMBER

      function addLessonBox(lessons, fatherElement) {
        const fragment = document.createDocumentFragment()
        lessons.map((lesson) => {
          const lessonBox = document.createElement("div")
          lessonBox.style.top = `${BOX_HEIGHT * (lesson.lessonDayTimeRange[0] - 1)}px`
          lessonBox.style.left = `${BOX_WIDTH * (lesson.lessonWeek - 1)}px`
          lessonBox.className = "lessonBox"
          lessonBox.style.width = BOX_WIDTH + 'px'
          lessonBox.style.height = BOX_HEIGHT * (lesson.lessonDayTimeRange[1] - lesson.lessonDayTimeRange[0] + 1) + 'px'

          const lessonName = document.createElement("div")
          lessonName.style.marginBottom = "2px"
          lessonName.innerText = lesson.lessonName
          const lessonClassRoom = document.createElement("div")
          lessonClassRoom.innerText = lesson.lessonClassRoom

          lessonBox.appendChild(lessonName)
          lessonBox.appendChild(lessonClassRoom)

          fragment.appendChild(lessonBox)
        })

        fatherElement.appendChild(fragment)
      }

      setTimeout(() => {
        addLessonBox(getWeekLesson(), rightLesson)
      }, 100)
    }

    renderLessonContainer()
