    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: url(./img/mmexport1647180994601.jpg) no-repeat center center;
            background-size: 60%;
        }

        a {
            text-decoration: none;
            color: black;
        }

        .todo {
            border: none;
            border-radius: 10%;
            position: fixed;
            top: 2%;
            left: 2%;
            height: 8%;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 20px;
            color: black;
            background-color: rgba(158, 42, 34, 0.2);
        }

        #top_navabar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(253, 252, 248);
        }

        .topBox {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: rgb(150, 150, 148);
            padding: 0 40px 0 40px;
            background-color: rgb(232, 231, 227);
        }

        .topBox:hover {
            background-color: rgb(63, 63, 63);
            color: rgb(223, 222, 218);
        }

        @media (max-width:720px) {
            .topBox {
                padding: 0 20px 0 20px;
            }
        }

        @media (max-width:480px) {
            .topBox {
                padding: 0 10px 0 10px;
            }
        }

        #audioIcon {
            width: 60px;
            position: fixed;
            top: 70%;
            left: -50px;
            margin: 20px;
            animation: rotate 10s linear infinite;
            animation-play-state: paused;
            opacity: 0.6;
            border-radius: 50%;
            box-shadow: 0px 0px 10px 2px #c0e70e;
            transition: all 0.5s ease-in-out;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #audioIcon:hover {
            opacity: 1;
            left: -10px;
        }

        .controls {
            width: 60vw;
            max-width: 300px;
            height: 100px;
            position: fixed;
            top: 70%;
            left: -100%;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 0 10px 10px 0;
            transition: all 0.5s ease-in-out;
        }

        .controls h3 {
            color: white;
            font-size: 20px;
            margin: 0;
            padding: 0;
            padding-left: 10px;
            padding-top: 10px;
        }

        .controls h6 {
            color: white;
            font-size: 12px;
            margin: 0;
            margin-top: 5px;
            padding: 0;
            padding-left: 10px;
        }


        .controls::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0));
        }

        .controlsAfter {
            content: '<';
            font-size: 20px;
            display: flex;
            align-items: center;
            color: white;
            justify-content: center;
            position: absolute;
            top: 0;
            right: calc(-10% - 5px);
            border-radius: 6px;
            width: 10%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .close {
            position: absolute;
            top: 5%;
            right: 2%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
        }

        .stopBtn,
        .playBtn {
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        .stopBtn {
            display: none;
        }

        .footer {
            position: fixed;
            bottom: 2%;
            left: 50%;
            transform: translate(-50%, 0);
            color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
