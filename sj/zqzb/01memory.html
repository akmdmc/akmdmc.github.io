    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        
        body {
            background: url(./img/-8f8450ab598df3f.jpg) no-repeat -1500px -1000px;
            object-fit: cover;
            overflow: hidden;
        }
        
        .box {
            width: 100%;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        @keyframes a1 {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .sheep {
            position: fixed;
            left: 0;
            top: 0%;
            background-color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateY(180deg) rotate(-90deg);
            animation: sheepMove 15s linear infinite;
        }
        
        @keyframes sheepMove {
            0% {}
            35% {
                top: 92%;
                left: 0;
                transform: rotateY(180deg) rotate(-90deg);
            }
            36% {
                top: 92%;
                left: 0;
                transform: rotateY(180deg) rotate(0deg);
            }
            50% {
                top: 92%;
                left: 86%;
                transform: rotateY(180deg) rotate(0deg);
            }
            51% {
                top: 92%;
                left: 86%;
                transform: rotateY(180deg) rotate(90deg);
            }
            85% {
                top: 0%;
                left: 86%;
                transform: rotateY(180deg) rotate(90deg);
            }
            86% {
                top: 0%;
                left: 86%;
                transform: rotateY(180deg) rotate(180deg);
            }
            99% {
                top: 0%;
                left: 0;
                transform: rotateY(180deg) rotate(180deg);
            }
            100% {
                top: 0%;
                left: 0;
                transform: rotateY(180deg) rotate(270deg);
            }
        }
