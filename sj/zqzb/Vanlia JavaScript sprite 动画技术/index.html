<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="canvas1"></canvas>
    <div class="controls">
        <label for="animations">选择动画</label>
        <select id="animations" name="animations">
          <option value="idle">无操作</option>
          <option value="jump">起跳</option>
          <option value="fall">降落</option>
          <option value="run">跑</option>
          <option value="dizzy">眩晕</option>
          <option value="sit">坐</option>
          <option value="roll">滚</option>
          <option value="bite">打</option>
          <option value="ko">被击败</option>
          <option value="getHit">受伤</option>
        </select>
    </div>
    <script src="script.js"></script>
</body>

</html>
