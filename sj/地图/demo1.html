<html>

<head>
  <meta charset='utf-8'>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.1.0/dist/leaflet.css"

    crossorigin="" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.3.1/leaflet.js"></script>
  <script src="./dark.js"></script>
  <title>车流量动态概念图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>

<body>
  <style>
    html,
    body,
    #main {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #time,
    #speed,
    #speedText,
    #zoomBtn,
    #levelColor,
    #developer {
      position: fixed;
      transform: translate(-50%, 0);
      z-index: 1000;
      color: whitesmoke;
    }

    #time {
      top: 6%;
      left: 25%;
    }

    #speed {
      left: 75%;
      top: 6%;
    }

    #speedText {
      position: absolute;
      left: -20%;
      top: -5%;
    }

    #zoomBtn {
      right: 1%;
      bottom: 5%;
      display: flex;
    }

    .btn {
      margin-left: 6px;
      border: none;
      outline: none;
      background-color: rgb(64, 158, 255);
      color: whitesmoke;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all linear 0.2s;
    }

    .btn:hover {
      background-color: rgb(43, 145, 248);
      transform: scale(1.05);
    }

    #min {
      padding: 5px 11px;
    }

    #levelColor {
      left: 5%;
      bottom: 5%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(0, 0);
      padding: 5px;
    }

    #levelColor span {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-left: 2px;
    }

    #developer {
      transform: translate(100%, 0);
      right: 0%;
      top: 20%;
      width: 10%;
      height: 40%;
      background-color: whitesmoke;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      flex-wrap: wrap;
      transition: all ease-in-out 0.3s;
    }

    #developer input {
      width: 60%;
    }
  </style>
  <div id="zoomBtn">
    <button class="btn" id="add">+</button>
    <button class="btn" id="min">-</button>
  </div>
  <div id='main'></div>
  <span id="time"></span>
  <div id="speed">
    <span id="speedText">speed: </span><input id="speedInput" type="range">
  </div>
  <div id="levelColor">
    <span style="background:linear-gradient(to right,rgb(97,134,80),rgb(199,216,88));"></span>
    <span style="background:linear-gradient(to right,rgb(199,216,88),rgb(253,216,5));"></span>
    <span style="background:linear-gradient(to right,rgb(253,216,5), rgb(238,152,0)) ;"></span>
    <span style="background:linear-gradient(to right, rgb(238,152,0), rgb(168,0,38));"></span>
    <span style="background:linear-gradient(to right, rgb(168,0,38), rgb(255, 0, 0));"></span>
  </div>
  <section id="developer">
    <input placeholder="day" id="developerday" type="text">
    <button id="developerBtn" class="btn">ok</button>
  </section>

  <script>
    let nowTime = 5;
    let nowDay = 1;
    let timeSpeed = 200;

    let dotToRoadId = new Map();
    let roadIdAndTimeToRoadinfo = new Map();

    let dotsLat = []
    let linesLat = [];

    let nowOption = {};

    const nowInterval = {
      timeInter: null,
      inter: null,
    };

    const DOT_CONFIG = {
      color: 'blue',
      symbolSize: 1,
    }

    const LEAFLET_CONFIG = {
      center: [120.6660541, 28.00335325],
      zoom: 13,
    }

    function getDayNData(day) {
      fetch(`/道路流量表/five_carflow201401${day < 10 ? '0' + day : day}.json`)
        .then(response => {
          response.json().then(data => {
            data.forEach(val => {
              roadIdAndTimeToRoadinfo.set(`day${day}id${val['road_id']}time${val['time_minute']}`, val);
            })
          })
        })
    }

    async function getTracks() {
      await fetch("./load_track_detail.json")
        .then(async response => {
          await response.json().then(data => {
            data.forEach(item => {
              const latlngs = [];
              for (let i = 1; i <= 4; i++) {
                if (item[`lat${i}`] && item[`lat${i}`] !== 'NULL') {
                  latlngs.push([item[`lat${i}`], item[`lng${i}`]]);
                }
              }
              linesLat.push({
                coords: latlngs,
                id: item['id']
              })
            });
            return linesLat;
          });
        })

      await fetch("/道路流量表/five_carflow20140101.json")
        .then(async response => {
          await response.json().then(data => {
            data.forEach(val => {
              roadIdAndTimeToRoadinfo.set(`day${nowDay}id${val['road_id']}time${val['time_minute']}`, val);
            })
          })
        })

      linesLat.map((track) => {
        return track.coords.map((lat, i) => {
          dotToRoadId.set([lat[1], lat[0]].toString(), track.id)
        })
      });

      linesLat = linesLat.map((track) => {
        return track.coords.map((lat) => {
          return [lat[1], lat[0]]
        })
      });

      // linesLat.forEach((val) => {
      //   val.forEach((dot) => {
      //     dotsLat.push(dot)
      //   })
      // })
    }

    function getRoadinfo(id, time) {
      return roadIdAndTimeToRoadinfo.get(`day${nowDay}id${id}time${time}`);
    }

    function getDotsLat() {
      dotsLat = [];
      linesLat.forEach((val) => {
        for (let i = 0; i < val.length; i++) {
          const dot = val[i];
          dotsLat.push(dot)
        }
      })
      return dotsLat;
    }

    const COLOR_LEVEL = {
      1: 'rgb(97, 134, 80)',
      2: 'rgb(199, 216, 88)',
      3: 'rgb(253, 216, 5)',
      4: 'rgb(238, 152, 0)',
      5: 'rgb(168, 0, 30)',
    }
    function getColor(levelNUm) {
      if (levelNUm < 10) {
        return COLOR_LEVEL[1];
      }
      else if (levelNUm < 20) {
        return COLOR_LEVEL[2]
      }
      else if (levelNUm < 30) {
        return COLOR_LEVEL[3]
      }
      else if (levelNUm < 40) {
        return COLOR_LEVEL[4]
      }
      else {
        return COLOR_LEVEL[5]
      }
    }

    var myChart = echarts.init(document.getElementById('main'), 'dark');

    function getZoom() {
      return LEAFLET_CONFIG.zoom;
    }

    setOptions()

    async function setOptions() {
      await getTracks();
      getDotsLat()
      nowOption = {
        title: {
          text: '车流量动态概念图',
          left: 'center',
          textStyle: {
            color: '#fff'
          }
        },
        tooltip: {
          trigger: 'item'
        },
        leaflet: {
          center: LEAFLET_CONFIG.center,
          zoom: LEAFLET_CONFIG.zoom,
          roam: false,
          inertia: true,
          layerControl: {
            position: 'topright',
          },
          tiles: [{
            label: 'Open Street Map',
            urlTemplate: 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
            options: {
              attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>, Tiles courtesy of <a href="http://hot.openstreetmap.org/" target="_blank">Humanitarian OpenStreetMap Team</a>',
            },
          }],
        },
        series: [
          {
            type: 'lines',
            coordinateSystem: 'leaflet',
            polyline: true,
            data: linesLat,
            polyline: true,
            lineStyle: {
              color: function (e) {
                const da = getRoadinfo(dotToRoadId.get(e.data[0].toString()), nowTime)
                return getColor(da['car_flow_in']);
              },
              opacity: 0.4,
              width: 1
            },
            //渐进式渲染
            progressiveThreshold: 500,
            progressive: 250
          },
          {
            type: 'lines',
            coordinateSystem: 'leaflet',
            polyline: true,
            data: linesLat,
            lineStyle: {
              width: 0,
              color: function (e) {
                const da = getRoadinfo(dotToRoadId.get(e.data[0].toString()), nowTime)
                return getColor(da['car_flow_in']);
              },
            },
            effect: {
              period: timeSpeed * 5 / 1000,
              show: true,
              symbol: 'circle',
              trailLength: 0.3,
              symbolSize: 2.5,
              large: true,
            },
            zlevel: 1,
          },
          // {
          //   name: '路段',
          //   type: 'scatter',
          //   coordinateSystem: 'leaflet',
          //   data: dotsLat,
          //   symbolSize: DOT_CONFIG.symbolSize,
          //   label: {
          //     normal: {
          //       formatter: '{b}',
          //       position: 'right',
          //       show: false
          //     },
          //     emphasis: {
          //       show: true
          //     }
          //   },
          //   itemStyle: {
          //     normal: {
          //       color: DOT_CONFIG.color
          //     }
          //   }
          // },
        ]
      };
      myChart.setOption(nowOption);
      document.querySelector(".leaflet-control-zoom").style.display = "none"
      startInterval(timeSpeed);
    }

    function startInterval(speed) {
      let i = 0;
      const timeInter = setInterval(() => {
        setTime(nowTime + i % 5);
        i++;
      }, speed)
      const inter = setInterval(() => {
        myChart.setOption(nowOption)
        nowTime = nowTime + 5;
        if (nowTime >= 1440) {
          nowTime = 5;
          nowDay++;
          if (nowDay > 15) {
            clearInterval(inter);
          }
        }
        if (nowTime >= 1200) {
          getDayNData(nowDay + 1);
        }
      }, speed * 5)

      nowInterval.inter = inter;
      nowInterval.timeInter = timeInter;
    }

    function setZoom(zoom) {
      nowOption['leaflet'].zoom = zoom;
      myChart.setOption(nowOption)
    }

    function setCenter(center) {
      nowOption['leaflet'].center = center;
      myChart.setOption(nowOption)
    }

    const timeShow = document.querySelector("#time")
    function setTime(timeNum) {
      timeShow.innerHTML = `day${nowDay} time:${Math.floor(timeNum / 60) < 1 ? '00' : (Math.floor(timeNum / 60) < 10 ? '0' + Math.floor(timeNum / 60) : Math.floor(timeNum / 60))}:${timeNum % 60 < 1 ? '00' : (timeNum % 60 < 10 ? '0' + timeNum % 60 : timeNum % 60)}`
    }

    const speedNavBar = document.querySelector("#speedInput");
    speedNavBar.value = (250 - timeSpeed) / 2;
    speedNavBar.addEventListener("change", (e) => {
      timeSpeed = 250 - e.target.value * 2;
      clearInterval(nowInterval.inter);
      clearInterval(nowInterval.timeInter);
      startInterval(timeSpeed)
    })
    speedNavBar.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      e.stopImmediatePropagation()
    })

    function a() {
      var throttle = function (type, name, obj) {
        obj = obj || window;
        var running = false;
        var func = function () {
          if (running) {
            return;
          }
          running = true;
          requestAnimationFrame(function () {
            obj.dispatchEvent(new CustomEvent(name));
            running = false;
          });
        };
        obj.addEventListener(type, func);
      };

      /* init - you can init any event */
      throttle("resize", "optimizedResize");
    }
    a();
    // handle event
    window.addEventListener("optimizedResize", function () {
      myChart.resize({
        width: 'auto',
        height: 'auto'
      });
    });
