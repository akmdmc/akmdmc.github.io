    body {
      margin: 0;
      padding: 0;
      background-color: #eee;
      font-size: 14px;
      font-family: '微软雅黑';
      line-height: 1.5;
      color: #333;
      overflow-x: hidden;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -webkit-box-sizing: border-box;
    }

    #container {
      width: 100%;
    }

    #linkList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background-color: #eee;
      border-radius: 10px;
      margin: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      transition: all 0.5s;
      cursor: pointer;
      user-select: none;
    }

    .link {
      color: black;
      transition: all 0.5s;
      padding: 5px 5px;
    }

    .link:hover {
      color: #000;
    }

    .link::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: #fff;
      opacity: 0;
      transition: all 0.5s;
    }

    .selected {
      /* color: rgb(249, 48, 48); */
      background-color: rgb(143, 185, 240);
      border-radius: 6px;
    }

    #showImg {
      width: 100%;
    }

    /* loading 动画 */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      font-size: 30px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      display: block;
    }
  </style>
</head>

    function createALink(url, i = 0) {
      fetch(url)
        .then(res => res.blob())
        .then(blob => {
          const a = document.createElement("a");
          a.classList = 'link'
          linkList.appendChild(a)
          a.innerText = ` ${imgAvailableNum} `
          a.addEventListener("click", () => {
            if (nowSelectedEle) {
              nowSelectedEle.classList.remove('selected')
            }
            a.classList.add('selected')
            nowSelectedEle = a
            showImg.style.display = 'none'
            loading.style.display = 'block'
            showImg.setAttribute('src', url)
          })
        })
        .finally(() => {
          imgAvailableNum += 1
        })
        .catch(err => {
          console.log(err);
        })
      // a.click()
      return imgAvailableNum
    }
