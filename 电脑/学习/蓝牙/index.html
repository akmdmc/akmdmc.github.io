<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .left,.right{
      padding: 10px;
      height: 400px;
      box-shadow: 0 0 3px #000;
      border-radius: 5px;
    }

    .left {
      width: 49%;
      align-self: flex-start;
      padding-bottom: 80px;
    }

    .right {
      width: 49%;
      overflow: auto;
      position: relative;
      padding-top: 80px;
      display: flex;
      flex-direction: column;
      align-items: start;
      padding-left: 20px;
    }

    .btn {
      padding: 5px 10px;
      margin: 10px;
      cursor: pointer;
      background-color: #1890ff;
      border: none;
      color: #fff;
      border-radius: 5px;
    }

    .btn:hover {
      background-color: #40a9ff;
    }
  </style>
</head>

<body>
  <h4>version:1.0.5</h4>
  <div class="container">
    <div class="left">
      <div id="uuid-conteainer">
        <p style="color: red;">此版本增加了写与读数据功能，请确保已经成功连上蓝牙</p>
        <!-- <p style="color: red;">测试按钮默认关闭，此按钮为开发人员的测试按钮，与蓝牙无关，即————<strong>别点</strong></p> -->
        <div>
          <div id="uuid-conteainer">
            <h4>uuid:</h4>
            <div>
              <label for="PrimaryService">PrimaryService(服务的UUID):</label>
              <input style="display: block;width: 80%;margin: 5px;margin-bottom: 15px;" type="text" id="PrimaryService"
                value="0xfff0">
            </div>
            <div>
              <label for="characteristic">characteristic(特性的UUID):</label>
              <input style="display: block;width: 80%;margin: 5px;margin-bottom: 15px;" type="text" id="characteristic" value="0xfff2">
            </div>
          </div>
        </div>
        <button class="btn" id="connectBlueTooth">连接蓝牙</button>
        <button style="display: none;" class="btn" id="testBtn">测试(关闭)</button>
      </div>
      <div id="write-container">
        <label for="writeValue">写数据：</label>
        <input id="writeValue" type="text">
        <button class="btn" id="write">写入</button>
      </div>
      <div id="read-container">
        <label for="readValue">读数据：</label>
        <span>会显示在操作记录中</span>
        <button class="btn" id="read">读取</button>
      </div>
    </div>
    <div class="right" id="操作记录">
      <h2 style="position: absolute;left: 50%;transform: translate(-50%);top: 5px;">操作记录</h2>
      <section id="operationHistory"></section>
    </div>
  </div>


  <!-- 蓝牙连接 -->
  <script>
    // let isConnectedCharacteristic = false;
    const originalMax = 3; // 最大重试次数
    let historyTime = 0; // 操作记录次数
    let nowUUid = {
      PrimaryService: '',
      characteristic: ''
    } // 当前uuid
    const blueToothOptions = {
      // filters: {},
      acceptAllDevices: false,
    } // 蓝牙配置
    var bluetoothDevice; // 蓝牙对象
    let btn = document.getElementById('connectBlueTooth') // 连接蓝牙按钮
    btn.addEventListener('click', getBlueObject)
    // 获取蓝牙对象
    async function getBlueObject() {
      nowUUid.PrimaryService = document.getElementById('PrimaryService').value
      nowUUid.characteristic = document.getElementById('characteristic').value
      historyTime++
      addOperationHistory('-------------------' + historyTime + '-------------------')
      addOperationHistory('开始获取蓝牙');
      bluetoothDevice = null;
      blueToothOptions.acceptAllDevices = true

      addOperationHistory('blueToothOptions', JSON.stringify(blueToothOptions))

      if (navigator.bluetooth) {
        addOperationHistory('navigator.bluetooth:', 'true')
      }
      else {
        addImportantOperationHistory('navigator.bluetooth:', '浏览器不支持蓝牙')
      }
      // 这一块的筛选条件在 推荐的网站1里面可以粗略的学习到
      await navigator.bluetooth.requestDevice(blueToothOptions).then(device => {
        bluetoothDevice = device
        // console.log('获取蓝牙成功', device);
        addOperationHistory('获取蓝牙成功')
        addOperationHistory('device:', JSON.stringify(device))
        // 监听蓝牙蓝牙断开
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected)
        connect()
      }).catch(err => {
        // alert('获取蓝牙失败')
        // console.log('获取蓝牙失败', err);
        addImportantOperationHistory('获取蓝牙失败')
      })
    }
    // 开始连接
    function connect() {
      exponentialBackoff(originalMax /* 最大重试次数 */, 2 /* 秒延迟 */,
        function toTry() {
          addOperationHistory('开始连接');
          return bluetoothDevice.gatt.connect();
        },
        function success(server) {
          getServer(server)
        },
        function fail() {
          // alert('连接失败')
          // console.log('连接失败');
          addImportantOperationHistory('连接失败')
        });
    }
    // 获取服务\特征,监听蓝牙数据返回
    function getServer(server) {
      // alert('连接成功')
      // console.log('连接成功', server);
      addOperationHistory('连接成功','开始获取服务信息')
      addOperationHistory('PrimaryService:', nowUUid.PrimaryService)

      server.getPrimaryService(nowUUid.PrimaryService).then(service => {
        // console.log('获取全部服务信息成功,开始获取特征信息', service)
        addOperationHistory('获取全部服务信息成功,开始获取特征信息')
        addOperationHistory('characteristic:', nowUUid.characteristic)
        return service.getCharacteristic(nowUUid.characteristic)
      }).then(characteristic => {

        return characteristic.startNotifications().then(_ => {
          // console.log('获取特征信息成功,开始监听蓝牙数据返回', characteristic);
          addOperationHistory('获取特征信息成功,开始监听蓝牙数据返回')
          characteristic.addEventListener('characteristicvaluechanged',
            handleNotifications);
        });
      }).catch(err => {
        // alert('获取服务失败', err)
        // console.log('获取服务失败', err);
        addImportantOperationHistory('获取服务失败', JSON.stringify(err),"请检查uuid是否正确")
      })
    }

    // 监听蓝牙断开
    function onDisconnected(max, delay, status) {
      // console.log('重连中');
      addImportantOperationHistory('重连中')
      connect()
    }

    // 重连
    function exponentialBackoff(max, delay, toTry, success, fail) {
      toTry().then(result => success(result))
        .catch(_ => {
          if (max === 0) {
            return fail();
          }
          setTimeout(function () {
            addImportantOperationHistory('重连中', originalMax - max + 1, '次')
            exponentialBackoff(--max, delay * 2, toTry, success, fail);
          }, delay * 1000);
        });
    }

    // 监听蓝牙数据返回
    function handleNotifications(event) {
      let value = event.target.value;
      let a = [];
      for (let i = 0; i < value.byteLength; i++) {
        a.push('0x' + ('00' + value.getUint8(i).toString(16)).slice(-2));
      }
      console.log('> ' + a.join(' '));
      addOperationHistory('> ' + a.join(' '))
    }

    // 操作记录
    const operationHistoryBox = document.getElementById('operationHistory');

    // 添加操作记录
    function addOperationHistory(...text) {
      const p = document.createElement('p');
      p.style.color = 'blue';
      p.textContent = text.join(' ');
      operationHistoryBox.appendChild(p);
    }

    function addImportantOperationHistory(...text) {
      const p = document.createElement('p');
      p.style.color = 'red';
      p.textContent = text.join(' ');
      operationHistoryBox.appendChild(p);
    }

  </script>

  <script>
    const writeBtn = document.getElementById('write')
    const readBtn = document.getElementById('read')
    writeBtn.addEventListener('click', writeData)
    readBtn.addEventListener('click', readData)
    function writeData() {
      if (!bluetoothDevice) {
        addImportantOperationHistory('请先连接蓝牙')
        return
      }
      let writeValue = document.getElementById('writeValue').value
      if (writeValue === '') {
        addImportantOperationHistory('写入数据不能为空')
        return
      }
      let nowCharacteristic = bluetoothDevice.gatt.getPrimaryService(nowUUid.PrimaryService).then(service => {
        return service.getCharacteristic(nowUUid.characteristic)
      }).then(characteristic => {
        return characteristic.writeValue(new TextEncoder().encode(writeValue))
      }).then(_ => {
        addOperationHistory('写入成功', writeValue)
      }).catch(err => {
        addImportantOperationHistory('写入失败', JSON.stringify(err),"请检查uuid是否正确")
      })
    }

    function readData() {
      if (!bluetoothDevice) {
        addImportantOperationHistory('请先连接蓝牙')
        return
      }
      let nowCharacteristic = bluetoothDevice.gatt.getPrimaryService(nowUUid.PrimaryService).then(service => {
        return service.getCharacteristic(nowUUid.characteristic)
      }).then(characteristic => {
        return characteristic.readValue()
      }).then(value => {
        let a = [];
        for (let i = 0; i < value.byteLength; i++) {
          a.push('0x' + ('00' + value.getUint8(i).toString(16)).slice(-2));
        }
        addOperationHistory('读取成功', '> ' + a.join(' '))
      }).catch(err => {
        addImportantOperationHistory('读取失败', JSON.stringify(err),"请检查uuid是否正确")
      })
    }
  </script>


  <!-- 测试 -->
  <script>
    const TEST_KEY = 'testKey'
    const testBtn = document.getElementById('testBtn')

    const bluetoothObjet = {
      battery: {
        services: ['battery_service'],
        PrimaryService: 'battery_service',
        characteristic: 'battery_level'
      },
      as: {
        services: [],
        optionalServices: [],
        PrimaryService: '0xFFF2',
        characteristic: '0xFFF1'
      }
    }
    let nowWatchObj = bluetoothObjet.battery

    testBtn.addEventListener('click', () => {
      // console.log('testBtn');
      const isTestOpen = localStorage.getItem(TEST_KEY);
      addOperationHistory('testBtn', isTestOpen)
      if (isTestOpen == undefined || isTestOpen === '0') {
        localStorage.setItem(TEST_KEY, '1');
        testBtn.textContent = '测试(开启)'
        addOperationHistory('测试模式开启')
      } else {
        localStorage.setItem(TEST_KEY, '0');
        testBtn.textContent = '测试(关闭)'
        addOperationHistory('测试模式关闭')
      }
    })
    const isTest = localStorage.getItem('testKey') === '1'
    testBtn.textContent = isTest ? '测试(开启)' : '测试(关闭)'
  </script>
</body>

</html>
