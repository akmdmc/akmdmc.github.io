<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const throttle = function (fn, delay) {
      let last = 0;
      return function () {
        let content = this;
        let args = arguments;
        let now = new Date();
        if (now - last > delay) {
          fn.apply(content, args);
          last = now;
        }
      }
    }

    const debounce = function (fn, delay) {
      let timer = null;
      return function () {
        const context = this;
        const args = arguments;
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }

        timer = setTimeout(() => {
          fn.apply(context, args);
        }, delay);
      }
    }

    const optDebounce = function (fn, delay) {
      let last = 0, timer = null;
      return function () {
        let context = this;
        let args = arguments;
        let now = new Date();

        if (now - last < delay) {
          clearTimeout(timer);
          timer = setTimeout(() => {
            last = now;
            fn.apply(context, args);
          }, delay);
        }
        else {
          fn.apply(context, args);
          last = now;
        }
      }
    }

    function test(str, times) {
      console.log(str, times, 'test')
    }

    const throttleTest = throttle(test, 1000);

    let count = 0;
    let timer = setInterval(() => {
      throttleTest('test', count++);
      if (count > 10) {
        clearInterval(timer);
      }
    }, 100)
  </script>
</body>

</html>
