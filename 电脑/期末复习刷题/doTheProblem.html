<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中医期末复习刷题</title>
  <script src="./data.js"></script>
  <link rel="stylesheet" href="./index.css">
</head>

<body>

  <!-- 切换错题库 -->
  <button class="changeLibraryButton">切换题库</button>

  <div class="question-container">
    <div class="title"><span class="problemLibraryID-span" id="problemLibraryID">题库1：</span><span class="type"
        id="type">单选题</span><span id="title"> 出了点问题哦，请联系QQ：3428771711</span></div>
    <div class="choose">
      <div class="chooses" id="chooses">
      </div>
      <textarea placeholder="请输入你的答案" style="width: 70%;" name="" id="myAnswer" cols="30" rows="5"></textarea>
    </div>
    <div class="answer" id="answer">[答案]A</div>
    <button id="ok">提交</button>
    <button id="incorrect">放入错题</button>
  </div>

  <button id="checkError">查看错题</button>
  <div id="errorBox">
  </div>

  <button id="help">帮助</button>
  <div id="helpbox">
    <button class="closeBtn" id="closeHelpBoxBtn">x</button>
    <p style="color: rgb(218, 74, 74);">请尽量不要切换浏览器，因为你的错题会保存在浏览器中！</p>
    <p style="color: rgb(215, 122, 55);">目前版本 1.0.3</p>
    <p>这是一个灰场简陋的帮助！</p>
    <p>显然马上要期末了，我根本没时间优化了。。。</p>
    <br>
    <p>版本 1.0.0</p>
    <p>点击 提交 后会显示答案</p>
    <p>点击 下一题 显示下一题</p>
    <br>
    <p>版本 1.0.1</p>
    <p>新增切换错题功能，同时新增了一个错题库，最新错题库为1</p>
    <p>新增消息提示框和版本检查提示功能。</p>
    <br>
    <p>版本 1.0.2</p>
    <p>新增毛概的题库啦！</p>
    <br>
    <p>版本 1.0.3</p>
    <p>移动端优化啦</p>
    <br>
  </div>

  <div id="messageBox" class="messageBox"></div>

  <div id="masking"></div>
  <script>
    const problemType = {
      1: "单项选择题",
      2: "多项选择题",
      3: "填空题",
      4: "名词解释",
      5: "问答题",
      6: "分析题",
    }

    const problemLibraryName = [
      "中基题库整合版",
      "2023版《概论》第一章",
      "2023版《概论》第二章",
      "2023版《概论》第四章",
      "2023版《概论》第五章",
      "2023版《概论》第六章",
      "2023版《概论》第七章",
    ]

    //生成随机数
    function createRanNum(min, max) {
      return Math.floor(min + Math.random() * (max - min + 1));
    }

    const version = "1.0.3";
    const versionMessage = "移动端优化！";
    const answer = document.querySelector("#answer");
    const titleText = document.querySelector("#title");
    const typeText = document.querySelector("#type");
    const chooses = document.querySelector("#chooses");
    const helpBtn = document.querySelector("#help");
    const helpBox = document.querySelector("#helpbox");
    const problemLibrary = document.querySelector("#problemLibraryID")
    const changeLibraryButton = document.querySelector(".changeLibraryButton");
    const masking = document.querySelector("#masking");
    let problem;
    let problemLibraryID = 0; //题目库ID

    //切换题库ID
    function changeProblemLibraryID() {
      if (problemLibraryID + 1 < data.length) {
        problemLibraryID++;
      }
      else {
        problemLibraryID = 0;
      }
    }

    //创建题目
    function createProblem() {
      const id = createRanNum(0, data[problemLibraryID].length - 1);
      problem = data[problemLibraryID][id];
      problem.id = id;
      titleText.textContent = problem.title;
      problemLibrary.textContent = `${problemLibraryName[problemLibraryID]}：`;
      typeText.textContent = problemType[problem.type];
      chooses.innerHTML = ""
      if (problem?.chooses) {
        problem.chooses.map(e => {
          const p = document.createElement("p");
          p.textContent = e;
          chooses.appendChild(p);
        })
      }
      answer.textContent = problem.answer;
      console.log(problem);
      return id;
    }

    //切换题库
    changeLibraryButton.addEventListener("click", () => {
      changeProblemLibraryID();
      createProblem();
    })

    //提交按钮
    const okBtn = document.querySelector("#ok");
    let flag = true;
    okBtn.addEventListener("click", () => {
      if (flag) {
        answer.style.display = "block";
        okBtn.textContent = "下一题"
        flag = false;
      }
      else {
        answer.style.display = "none";
        okBtn.textContent = "提交"
        flag = true;
        createProblem();
      }
    })

    //放入错题按钮
    const incorrectBtn = document.querySelector("#incorrect");
    incorrectBtn.addEventListener("click", () => {
      let map = JSON.parse(localStorage.getItem("zyqmfxctb"));//中医期末复习错题本
      // console.log(problem, map);
      if (map == null) {
        map = {};
      }
      map[problem.id] = problem;
      localStorage.setItem("zyqmfxctb", JSON.stringify(map));
      message("已放入错题本!");
    })

    //查看错题按钮
    const checkErrorBtn = document.querySelector("#checkError");
    const errorBox = document.querySelector("#errorBox");
    let show = false;
    checkErrorBtn.addEventListener("click", () => {
      if (!show) {
        errorBox.style.transform = "scale(1)";
        show = true;
      }
      else {
        errorBox.style.transform = "scale(0)";
        show = false;
      }
      errorBox.innerHTML = '';
      let map = JSON.parse(localStorage.getItem("zyqmfxctb"));//中医期末复习错题本
      for (const key in map) {
        if (Object.hasOwnProperty.call(map, key)) {
          const element = map[key];
          let chooses = "";
          element.chooses.map(e => {
            chooses += e;
          })
          const cardHtml = `
      <div class="title">${element.title}</div>
      <div class="chooses">
        ${chooses}
      </div>
      <div class="answer">${element.answer}</div>
    `
          const div = document.createElement("div");
          div.classList = "card";
          div.innerHTML = cardHtml;
          errorBox.appendChild(div)
        }
      }

    })

    //帮助按钮
    function showHelpBox() {
      helpBox.style.display = "block";
      maskingShow();
    }
    helpBtn.addEventListener("click", showHelpBox)
    function closeHelpBox() {
      helpBox.style.display = "none";
      maskingHide();
    }

    //帮助框双击关闭
    helpBox.addEventListener("dblclick", closeHelpBox)
    //关闭按钮
    document.querySelector("#closeHelpBoxBtn").addEventListener("click", closeHelpBox)

    //遮罩层
    function maskingShow() {
      masking.style.display = "block";
    }

    function maskingHide() {
      masking.style.display = "none";
    }

    //消息提示
    const messageBox = document.querySelector("#messageBox");
    function message(content, type = "success") {
      messageBox.classList = "messageBox";
      if (type === "error") {
        messageBox.classList.add("error");
      }
      else if (type === "info") {
        messageBox.classList.add("info");
      }
      else {
        messageBox.classList.add("success");
      }
      messageBox.textContent = content;
      messageBox.style.transform = "translate(-50%, 0) scale(1)";
      setTimeout(() => {
        messageBox.style.transform = "translate(-50%, 0) scale(0)";
      }, 2000);
    }

    function checkVersion() {
      const localVersion = localStorage.getItem("zyqmfxctb-version");
      if (localVersion !== version) {
        message("版本更新啦！新增内容：" + versionMessage, "info");
        localStorage.setItem("zyqmfxctb-version", version);
      }
      else {
        message("欢迎使用中医期末复习刷题！");
      }
    }

    createProblem();
    checkVersion();
  </script>
</body>

</html>
