<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            overflow: hidden;
            background: url(./img/2.webp) right top;
        }
        
        li {
            list-style: none;
        }
        
        a {
            text-decoration: none;
            color: white;
        }
        
        h1 {
            margin: 0;
            padding: 20px 0 20px 40px;
            text-align: center;
            font-size: 28px;
            color: #cfd8dc;
        }
        
        ul {
            display: flex;
            padding: 0;
            margin: 0;
        }
        
        .choice>li {
            flex: 1;
            position: relative;
            text-align: center;
            line-height: 60px;
            height: 60px;
            font-weight: 600;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
        }
        /* .choice>li:hover {
            background-color: #455a64;
        } */
        
        .choice-inner {
            padding: 0;
            margin: 0;
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .choice-inner li {
            opacity: 0;
            transition: all 1s;
            text-align: center;
            line-height: 60px;
            width: 100%;
            height: 60px;
            /* background-color: rgba(84, 110, 122, .7); */
            background: hsla(0, 0%, 0%, .25) border-box;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 0 1px hsl(0deg 0% 100% / 30%) inset, 0 0.5em 1em rgb(0 0 0 / 60%);
            text-shadow: 0 1px 1px hsla(0, 0%, 100%, .3);
        }
        
        .choice-inner li:hover {
            background-color: #90a4ae;
        }
    </style>
</head>

<body>
    <ul class="choice">
        <li class="choiceBox">测试
            <ol class="choice-inner">
                <li><a href="./sj/text/1.geo.html">地理位置测试</a></li>
                <li><a href="./sj/text/2.battery.html">电池测试</a></li>
                <li><a href="./sj/text/3.orientation.html">方向测试</a></li>
            </ol>
        </li>
        <li class="choiceBox">游戏
            <ol class="choice-inner">
                <li> <a target="_blank" href="./sj/game/01.html">井字棋</a>
                </li>
                <li>
                    <a href="./sj/game/saolei/dist/index.html">扫雷</a>
                </li>
                <li>
                    <a href="./sj/game/简单的跳跳乐/简单的跳跳乐.html">简单的跳跳乐</a>
                </li>
                <li></li>
                <li></li>
            </ol>
        </li>
        <li class="choiceBox">学习
            <ol class="choice-inner">
                <li>
                    <a href="./sj/qm/index.html">清眸</a>
                </li>
            </ol>
        </li>
        <li class="choiceBox">杂七杂八
            <ol class="choice-inner">
                <li>
                    <a href="./sj/zqzb/01memory.html">音乐</a>
                </li>
                <li>
                    <a href="./sj/zqzb/Vanlia JavaScript sprite 动画技术/index.html">小狗狗</a>
                </li>
                <li></li>
                <li></li>
                <li></li>
            </ol>
        </li>
    </ul>
    <script>
        let choiceBox = document.querySelectorAll('.choiceBox');
        let flag = true;
        window.addEventListener("click", function() {
            if (flag) {
                for (let j = 0; j < choiceBox.length; j++) {
                    for (let k = 0; k < choiceBox[j].children[0].children.length; k++) {
                        choiceBox[j].children[0].children[k].style.opacity = 0;
                        choiceBox[j].children[0].children[k].style.display = "none";
                    }

                }
            }
        })
        for (let i = 0; i < choiceBox.length; i++) {
            choiceBox[i].addEventListener('click', function() {
                flag = false;
                for (let j = 0; j < choiceBox.length; j++) {
                    for (let k = 0; k < choiceBox[j].children[0].children.length; k++) {
                        choiceBox[j].children[0].children[k].style.opacity = 0;
                        choiceBox[j].children[0].children[k].style.display = "none";
                    }
                }
                for (let j = 0; j < choiceBox[i].children[0].children.length; j++) {
                    choiceBox[i].children[0].children[j].style.opacity = 1
                    choiceBox[i].children[0].children[j].style.display = "block";
                    choiceBox[i].children[0].children[j].addEventListener('click', function() {
                        for (let k = 0; k < choiceBox[i].children[0].children.length; k++) {
                            choiceBox[i].children[0].children[k].style.backgroundColor = "#90a4ae"
                        }
                        this.style.backgroundColor = "#455a64"
                    })

                }
                setTimeout(() => {
                    flag = true
                }, 10)
            })
        }
    </script>
</body>

</html>
